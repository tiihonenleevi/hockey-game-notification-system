name: Test access to tulospalvelu

# Run this by hand from the Actions tab. It makes ONE plain request and
# prints whether the service answers or refuses. Nothing is posted anywhere.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One honest request
        env:
          CONTACT: ${{ vars.CONTACT }}
        run: python run.py test
