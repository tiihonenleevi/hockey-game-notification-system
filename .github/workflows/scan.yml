name: Scan schedule

# Once a day: look a month ahead for new or moved KaPa-51 games.
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Seed state without sending anything"
        type: boolean
        default: false

concurrency:
  group: kapa51-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the weeks ahead
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTACT: ${{ vars.CONTACT }}
          SCHEDULE_DAYS: "30"
        run: |
          python run.py scan ${{ inputs.bootstrap && '--bootstrap' || '' }}

      - name: Save state
        run: |
          git config user.name "kapa51-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state.json archive
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "schedule: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
